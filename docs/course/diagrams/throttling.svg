<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 186">
  <style>
    .ln { font: 700 10px 'Segoe UI', sans-serif; fill: #2d3748; }
    .ls { font: 8.5px 'Segoe UI', sans-serif; fill: #718096; }
    .ax { font: 8.5px 'Segoe UI', sans-serif; fill: #718096; text-anchor: middle; }
    .t { font: 9px 'Segoe UI', sans-serif; fill: #2d3748; }
    .big { font: 700 13px 'Segoe UI', sans-serif; }
  </style>

  <!-- axis: 0..1200 ms -> x 200..740 -->
  <line x1="200" y1="160" x2="740" y2="160" stroke="#a0aec0"/>
  <g stroke="#a0aec0">
    <line x1="200" y1="156" x2="200" y2="164"/><line x1="335" y1="156" x2="335" y2="164"/>
    <line x1="470" y1="156" x2="470" y2="164"/><line x1="605" y1="156" x2="605" y2="164"/>
    <line x1="740" y1="156" x2="740" y2="164"/>
  </g>
  <text class="ax" x="200" y="176">0 ms</text><text class="ax" x="335" y="176">300</text>
  <text class="ax" x="470" y="176">600</text><text class="ax" x="605" y="176">900</text><text class="ax" x="740" y="176">1200</text>

  <!-- the DOM change -->
  <line x1="222" y1="14" x2="222" y2="160" stroke="#6b46c1" stroke-dasharray="3 3"/>
  <text class="ls" x="228" y="20" style="fill:#6b46c1">the send button appears (~50 ms)</text>

  <!-- timers -->
  <text class="ln" x="12" y="52">wait with timers</text><text class="ls" x="12" y="64">hidden / minimized tab</text>
  <rect x="200" y="38" width="477" height="26" rx="5" fill="#fff5f5" stroke="#fc8181"/>
  <g fill="#c53030"><circle cx="200" cy="51" r="4"/><circle cx="650" cy="51" r="4"/></g>
  <text class="t" x="300" y="55">Chrome delays timers in hidden tabs to about once per second</text>
  <text class="big" x="686" y="56" style="fill:#c53030">1,064 ms</text>

  <!-- observer -->
  <text class="ln" x="12" y="112">wait with</text><text class="ln" x="12" y="125">MutationObserver</text>
  <rect x="200" y="98" width="31" height="26" rx="5" fill="#eaf7ef" stroke="#38a169"/>
  <text class="t" x="240" y="115">DOM observers are not throttled: the change is seen at once</text>
  <text class="big" x="560" y="116" style="fill:#2f855a">69 ms</text>
  <text class="ls" x="606" y="116">(measured, minimized window)</text>
</svg>
