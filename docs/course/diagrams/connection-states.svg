<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .t { font: 700 11px 'Segoe UI', sans-serif; text-anchor: middle; }
    .s { font: 9px 'Segoe UI', sans-serif; fill: #4a5568; text-anchor: middle; }
    .e { font: 9.5px 'Segoe UI', sans-serif; fill: #2d3748; }
  </style>

  <rect x="20" y="64" width="120" height="46" rx="23" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.4"/>
  <text class="t" x="80" y="84" style="fill:#c53030">off</text><text class="s" x="80" y="99">badge OFF</text>
  <rect x="240" y="64" width="130" height="46" rx="23" fill="#fffaeb" stroke="#d69e2e" stroke-width="1.4"/>
  <text class="t" x="305" y="84" style="fill:#975a16">connecting</text><text class="s" x="305" y="99">socket + hello</text>
  <rect x="470" y="64" width="120" height="46" rx="23" fill="#eaf7ef" stroke="#38a169" stroke-width="1.4"/>
  <text class="t" x="530" y="84" style="fill:#2f855a">on</text><text class="s" x="530" y="99">badge ON</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <path d="M140,80 H239"/>
    <path d="M370,80 H469"/>
    <path d="M530,110 C530,160 80,160 80,111"/>
    <path d="M305,110 C305,132 120,132 100,112"/>
    <path d="M60,64 C40,20 120,20 100,62"/>
  </g>
  <text class="e" x="150" y="74">backoff timer</text>
  <text class="e" x="384" y="74">welcome</text>
  <text class="e" x="250" y="168">socket closed → reconnect after 1 s, 2 s, then every 5 s</text>
  <text class="e" x="170" y="127">failed</text>
  <text class="e" x="110" y="22">no token: wait for a settings change</text>

  <rect x="618" y="18" width="130" height="146" rx="9" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="683" y="36" style="font: 700 9.5px 'Segoe UI'; fill: #4a5568; text-anchor: middle">what wakes it</text>
  <text class="e" x="628" y="58">alarm every 30 s</text>
  <text class="s" x="683" y="71">→ ensure()</text>
  <text class="e" x="628" y="94">browser start, install</text>
  <text class="s" x="683" y="107">→ ensure()</text>
  <text class="e" x="628" y="130">port / token / provider</text>
  <text class="e" x="628" y="143">changed, or Reconnect</text>
  <text class="s" x="683" y="156">→ restart()</text>
</svg>
