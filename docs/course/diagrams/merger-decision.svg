<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .t { font: 10px 'Segoe UI', sans-serif; fill: #1a202c; text-anchor: middle; }
    .tb { font: 700 10px 'Segoe UI', sans-serif; text-anchor: middle; }
    .y { font: 600 9px 'Segoe UI', sans-serif; fill: #2f855a; }
    .n { font: 600 9px 'Segoe UI', sans-serif; fill: #c53030; }
    .d { fill: #fff; stroke: #4a5568; stroke-width: 1.2; }
    .p { fill: #ebf4ff; stroke: #2b6cb0; stroke-width: 1.2; }
    .r { font: 9.5px 'Segoe UI', sans-serif; fill: #2d3748; }
  </style>

  <rect x="20" y="10" width="310" height="30" rx="15" fill="#2d3748"/>
  <text class="t" x="175" y="29" style="fill:#fff; font-weight:600">new snapshot W from Live Captions</text>

  <rect class="d" x="20" y="56" width="310" height="30" rx="7"/>
  <text class="t" x="175" y="75">empty, or identical to the last snapshot?</text>
  <rect class="d" x="20" y="102" width="310" height="30" rx="7"/>
  <text class="t" x="175" y="121">is the transcript still empty?</text>
  <rect class="p" x="20" y="148" width="310" height="40" rx="7"/>
  <text class="t" x="175" y="164">find the key: W's first ≤ 8 words (retry from words 2–5)</text>
  <text class="t" x="175" y="178">in the transcript tail</text>
  <rect class="p" x="20" y="204" width="310" height="40" rx="7"/>
  <text class="t" x="175" y="220">align every hit word by word, ignoring case and</text>
  <text class="t" x="175" y="234">punctuation; resync over ≤ 12 skipped words</text>
  <rect class="d" x="20" y="260" width="310" height="30" rx="7"/>
  <text class="t" x="175" y="279">best acceptable alignment found?</text>
  <rect class="d" x="20" y="306" width="310" height="30" rx="7"/>
  <text class="t" x="175" y="325">does any hit match ≥ 8 words?</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="175" y1="40" x2="175" y2="55"/><line x1="175" y1="86" x2="175" y2="101"/>
    <line x1="175" y1="132" x2="175" y2="147"/><line x1="175" y1="188" x2="175" y2="203"/>
    <line x1="175" y1="244" x2="175" y2="259"/><line x1="175" y1="290" x2="175" y2="305"/>
    <line x1="175" y1="336" x2="175" y2="351"/>
    <line x1="330" y1="71" x2="359" y2="71"/><line x1="330" y1="117" x2="359" y2="117"/>
    <line x1="330" y1="275" x2="359" y2="275"/><line x1="330" y1="321" x2="359" y2="321"/>
    <path d="M550,269 H579"/><path d="M550,281 H565 V303 H579"/>
  </g>
  <text class="n" x="184" y="98">no</text><text class="n" x="184" y="144">no</text>
  <text class="n" x="184" y="302">no</text><text class="n" x="184" y="348">no</text>
  <text class="y" x="336" y="66">yes</text><text class="y" x="336" y="112">yes</text>
  <text class="y" x="336" y="270">yes</text><text class="y" x="336" y="316">yes</text>
  <text class="y" x="555" y="265">yes</text><text class="n" x="552" y="298">no</text>

  <!-- outcomes -->
  <rect x="360" y="56" width="190" height="30" rx="7" fill="#f7fafc" stroke="#a0aec0"/>
  <text class="tb" x="455" y="75" style="fill:#4a5568">Unchanged</text>
  <rect x="360" y="102" width="190" height="30" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text class="tb" x="455" y="121" style="fill:#2b6cb0">Appended (whole window)</text>
  <rect class="d" x="360" y="260" width="190" height="30" rx="7"/>
  <text class="t" x="455" y="279">window ends inside the transcript?</text>
  <rect x="580" y="256" width="160" height="26" rx="7" fill="#f7fafc" stroke="#a0aec0"/>
  <text class="tb" x="660" y="273" style="fill:#4a5568">Unchanged (stale)</text>
  <rect x="580" y="290" width="160" height="26" rx="7" fill="#eaf7ef" stroke="#38a169"/>
  <text class="tb" x="660" y="307" style="fill:#2f855a">Replaced (tail ← window)</text>
  <rect x="360" y="306" width="190" height="30" rx="7" fill="#fffaeb" stroke="#d69e2e"/>
  <text class="tb" x="455" y="325" style="fill:#b7791f">OverlapAppended</text>
  <rect x="20" y="352" width="310" height="30" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text class="tb" x="175" y="371" style="fill:#2b6cb0">Appended (new speech, captions restarted)</text>
  <text class="r" x="362" y="350" style="font-size:9px; fill:#718096">keep the transcript, append only W's unmatched end</text>

  <!-- safety rules -->
  <rect x="580" y="56" width="160" height="186" rx="9" fill="#fffaeb" stroke="#d69e2e"/>
  <text x="660" y="74" style="font: 700 10px 'Segoe UI'; fill: #b7791f; text-anchor: middle">acceptable = safe</text>
  <text class="r" x="590" y="94">• ≥ 3 words matched</text>
  <text class="r" x="590" y="112">• weak match (&lt; 6 words):</text>
  <text class="r" x="600" y="125">drop ≤ 1 transcript word</text>
  <text class="r" x="590" y="143">• otherwise ≤ matched / 2,</text>
  <text class="r" x="600" y="156">never more than 40</text>
  <text class="r" x="590" y="174">• window used up: ≤ 3 words</text>
  <text class="r" x="600" y="187">may merge away (C sharp → C#)</text>
  <text class="r" x="590" y="207">• ties: more matched, fewer</text>
  <text class="r" x="600" y="220">dropped, later position</text>
</svg>
