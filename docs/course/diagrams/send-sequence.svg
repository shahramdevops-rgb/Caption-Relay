<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
  </defs>
  <style>
    .h { font: 700 9.5px 'Segoe UI', sans-serif; text-anchor: middle; }
    .hs { font: 8.5px 'Segoe UI', sans-serif; fill: #4a5568; text-anchor: middle; }
    .m { font: 9px 'Segoe UI', sans-serif; fill: #2d3748; text-anchor: middle; }
    .mg { font: 9px 'Segoe UI', sans-serif; fill: #2f855a; text-anchor: middle; }
    .c { font: 8.5px 'Cascadia Mono', Consolas, monospace; fill: #6b46c1; text-anchor: middle; }
  </style>

  <!-- lifeline heads -->
  <g>
    <rect x="12" y="8" width="96" height="36" rx="7" fill="#f7fafc" stroke="#a0aec0"/>
    <text class="h" x="60" y="24" style="fill:#2d3748">Hook thread</text><text class="hs" x="60" y="37">key up</text>
    <rect x="122" y="8" width="96" height="36" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text class="h" x="170" y="24" style="fill:#1a4971">SendController</text><text class="hs" x="170" y="37">UI thread</text>
    <rect x="232" y="8" width="96" height="36" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text class="h" x="280" y="24" style="fill:#1a4971">CaptionCapture</text><text class="hs" x="280" y="37">transcript</text>
    <rect x="342" y="8" width="96" height="36" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text class="h" x="390" y="24" style="fill:#1a4971">RelayServer</text><text class="hs" x="390" y="37">WebSocket</text>
    <rect x="462" y="8" width="96" height="36" rx="7" fill="#eaf7ef" stroke="#2f855a"/>
    <text class="h" x="510" y="24" style="fill:#1c5235">Service worker</text><text class="hs" x="510" y="37">provider: gemini</text>
    <rect x="572" y="8" width="96" height="36" rx="7" fill="#f3eeff" stroke="#6b46c1"/>
    <text class="h" x="620" y="24" style="fill:#44337a">Content script</text><text class="hs" x="620" y="37">in the Gemini tab</text>
    <rect x="682" y="8" width="70" height="36" rx="7" fill="#f3eeff" stroke="#6b46c1"/>
    <text class="h" x="717" y="24" style="fill:#44337a">Gemini</text><text class="hs" x="717" y="37">page DOM</text>
  </g>
  <g stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="60" y1="44" x2="60" y2="320"/><line x1="170" y1="44" x2="170" y2="320"/>
    <line x1="280" y1="44" x2="280" y2="320"/><line x1="390" y1="44" x2="390" y2="320"/>
    <line x1="510" y1="44" x2="510" y2="320"/><line x1="620" y1="44" x2="620" y2="320"/>
    <line x1="717" y1="44" x2="717" y2="320"/>
  </g>

  <!-- forward messages -->
  <g stroke="#2d3748" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="60" y1="66" x2="168" y2="66"/>
    <line x1="170" y1="92" x2="278" y2="92"/>
    <line x1="170" y1="126" x2="388" y2="126"/>
    <line x1="390" y1="152" x2="508" y2="152"/>
    <line x1="510" y1="178" x2="618" y2="178"/>
    <line x1="510" y1="204" x2="618" y2="204"/>
    <line x1="620" y1="230" x2="715" y2="230"/>
  </g>
  <text class="m" x="114" y="61">Send (BeginInvoke)</text>
  <text class="m" x="224" y="87">Take() → text + ticket</text>
  <text class="m" x="280" y="121">SendAsync(prefix + text)</text>
  <text class="c" x="450" y="147">send {id, text}</text>
  <text class="m" x="565" y="173">ping (≤ 1 s)</text>
  <text class="m" x="565" y="199">deliver</text>
  <text class="m" x="668" y="225">insert, click</text>

  <!-- returns -->
  <g stroke="#2f855a" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#ag)">
    <line x1="715" y1="252" x2="622" y2="252"/>
    <line x1="620" y1="270" x2="512" y2="270"/>
    <line x1="510" y1="288" x2="392" y2="288"/>
    <line x1="390" y1="306" x2="172" y2="306"/>
  </g>
  <text class="mg" x="668" y="247">new turn seen</text>
  <text class="mg" x="565" y="265">{status: sent}</text>
  <text class="c" x="450" y="283" style="fill:#2f855a">ack {id, sent}</text>
  <text class="mg" x="280" y="301">SendOutcome.Sent</text>
  <line x1="170" y1="316" x2="278" y2="316" stroke="#2d3748" stroke-width="1.3" marker-end="url(#ar)"/>
  <text class="m" x="224" y="330">Confirm(ticket)</text>
  <text class="m" x="100" y="330" style="fill:#2f855a; font-weight:600">"Sent ✓" + tone</text>

  <!-- timing bracket -->
  <path d="M752,62 h4 v250 h-4" fill="none" stroke="#6b46c1" stroke-width="1.2"/>
  <text x="742" y="344" style="font: 600 9px 'Segoe UI'; fill: #6b46c1; text-anchor: end">≈ 60–110 ms from the key to a submitted message</text>
</svg>
