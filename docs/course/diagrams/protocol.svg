<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/>
    </marker>
  </defs>
  <style>
    .ph { font: 700 8.5px 'Segoe UI', sans-serif; letter-spacing: 1px; fill: #a0aec0; }
    .m { font: 9px 'Cascadia Mono', Consolas, monospace; fill: #2d3748; text-anchor: middle; }
    .n { font: 9px 'Segoe UI', sans-serif; fill: #718096; }
    .bad { font: 9px 'Segoe UI', sans-serif; fill: #c53030; }
  </style>

  <rect x="166" y="6" width="128" height="30" rx="7" fill="#eaf7ef" stroke="#2f855a"/>
  <text x="230" y="25" style="font: 700 10px 'Segoe UI'; fill: #1c5235; text-anchor: middle">Extension (client)</text>
  <rect x="530" y="6" width="128" height="30" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="594" y="25" style="font: 700 10px 'Segoe UI'; fill: #1a4971; text-anchor: middle">App (server)</text>
  <line x1="230" y1="36" x2="230" y2="424" stroke="#cbd5e0" stroke-dasharray="3 3"/>
  <line x1="594" y1="36" x2="594" y2="424" stroke="#cbd5e0" stroke-dasharray="3 3"/>

  <g stroke="#e2e8f0">
    <line x1="10" y1="48" x2="750" y2="48"/><line x1="10" y1="158" x2="750" y2="158"/>
    <line x1="10" y1="218" x2="750" y2="218"/><line x1="10" y1="278" x2="750" y2="278"/>
    <line x1="10" y1="388" x2="750" y2="388"/>
  </g>
  <text class="ph" x="12" y="62">CONNECT</text>
  <text class="ph" x="12" y="172">KEEP ALIVE</text>
  <text class="ph" x="12" y="232">SEND</text>
  <text class="ph" x="12" y="292">SEND WHILE</text><text class="ph" x="12" y="304">CHAT IS BUSY</text>
  <text class="ph" x="12" y="402">DIAGNOSTICS</text>

  <g stroke="#2d3748" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="230" y1="70" x2="592" y2="70"/>
    <line x1="594" y1="94" x2="232" y2="94"/>
    <line x1="230" y1="118" x2="592" y2="118"/>
    <line x1="594" y1="142" x2="232" y2="142"/>
    <line x1="594" y1="178" x2="232" y2="178"/>
    <line x1="230" y1="202" x2="592" y2="202"/>
    <line x1="594" y1="238" x2="232" y2="238"/>
    <line x1="230" y1="262" x2="592" y2="262"/>
    <line x1="594" y1="298" x2="232" y2="298"/>
    <line x1="230" y1="322" x2="592" y2="322"/>
    <line x1="230" y1="372" x2="592" y2="372"/>
    <line x1="230" y1="408" x2="592" y2="408"/>
  </g>
  <text class="m" x="412" y="65">HTTP upgrade · Origin: chrome-extension://&lt;id&gt;</text>
  <text class="m" x="412" y="89">101 Switching Protocols</text>
  <text class="m" x="412" y="113">{"type":"hello","token":"…","protocol":1,"provider":"gemini"}</text>
  <text class="m" x="412" y="137">{"type":"welcome","protocol":1}</text>
  <text class="m" x="412" y="173">{"type":"ping"}</text>
  <text class="m" x="412" y="197">{"type":"pong"}</text>
  <text class="m" x="412" y="233">{"type":"send","id":"7f3a…","text":"…"}</text>
  <text class="m" x="412" y="257">{"type":"ack","id":"7f3a…","status":"sent","provider":"gemini"}</text>
  <text class="m" x="412" y="293">{"type":"send","id":"c41e…","text":"…"}</text>
  <text class="m" x="412" y="317">{"type":"ack","id":"c41e…","status":"queued"}</text>
  <text x="412" y="343" style="font: italic 9px 'Segoe UI'; fill: #6b46c1; text-anchor: middle">… Gemini finishes its answer; queued texts are merged and submitted …</text>
  <text class="m" x="412" y="367">{"type":"result","id":"c41e…","status":"sent"}</text>
  <text class="m" x="412" y="403">{"type":"log","level":"info","text":"target tab #12 …"}</text>

  <text class="bad" x="600" y="98">else 403</text>
  <text class="bad" x="600" y="146">bad token → error, close 1008</text>
  <text class="n" x="600" y="182">every 20 s</text>
  <text class="n" x="600" y="206">silent 65 s → close</text>
  <text class="n" x="600" y="266">no ack in 3 s → text kept</text>
  <text class="n" x="600" y="376">≤ 200 s, else text kept</text>
  <text class="n" x="600" y="412">never chat text</text>
</svg>
