<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .zl { font: 700 8.5px 'Segoe UI', sans-serif; letter-spacing: 1px; }
    .t { font: 700 10.5px 'Segoe UI', sans-serif; text-anchor: middle; }
    .s { font: 8.5px 'Segoe UI', sans-serif; fill: #4a5568; text-anchor: middle; }
    .m { font: 9px 'Cascadia Mono', Consolas, monospace; fill: #2d3748; text-anchor: middle; }
  </style>

  <rect x="12" y="8" width="736" height="44" rx="10" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text class="t" x="380" y="26" style="fill:#1a4971">Windows app + protocol: provider-neutral</text>
  <text class="m" x="380" y="42">send {id, text}  →  ack {id, status: sent | queued | error, provider}</text>

  <rect x="190" y="74" width="380" height="44" rx="10" fill="#fff" stroke="#2f855a" stroke-width="1.4"/>
  <text class="t" x="380" y="92" style="fill:#1c5235">registry → one interface</text>
  <text class="m" x="380" y="108">{ id, name, deliver(text, ctx) → {status, detail} }</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="380" y1="52" x2="380" y2="73"/>
    <path d="M300,118 V139"/><path d="M500,118 V139"/>
  </g>

  <!-- web chat family -->
  <rect x="12" y="140" width="452" height="116" rx="12" fill="#f7f3ff" stroke="#d6bcfa"/>
  <text class="zl" x="24" y="156" fill="#6b46c1">WEB-CHAT PROVIDERS · content script in the chat tab</text>
  <rect x="24" y="164" width="132" height="44" rx="8" fill="#fff" stroke="#6b46c1" stroke-width="1.6"/>
  <text class="t" x="90" y="182" style="fill:#44337a">Gemini</text><text class="s" x="90" y="198">built and proven</text>
  <rect x="172" y="164" width="132" height="44" rx="8" fill="#fff" stroke="#b794f4" stroke-dasharray="4 3"/>
  <text class="t" x="238" y="182" style="fill:#805ad5">ChatGPT</text><text class="s" x="238" y="198">planned · Phase 13</text>
  <rect x="320" y="164" width="132" height="44" rx="8" fill="#fff" stroke="#b794f4" stroke-dasharray="4 3"/>
  <text class="t" x="386" y="182" style="fill:#805ad5">Claude.ai</text><text class="s" x="386" y="198">planned · Phase 14</text>
  <rect x="24" y="216" width="428" height="32" rx="8" fill="#ede9fe" stroke="#b794f4"/>
  <text class="s" x="238" y="229" style="fill:#44337a; font-weight:600">shared webchat.js: insert · submit · verify · busy queue · background tab</text>
  <text class="s" x="238" y="242">each provider adds only its selectors and "is busy / did it appear" checks</text>

  <!-- api family -->
  <rect x="476" y="140" width="272" height="116" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-dasharray="5 3"/>
  <text class="zl" x="488" y="156" fill="#718096">API PROVIDERS · planned, Phase 15</text>
  <rect x="488" y="164" width="120" height="44" rx="8" fill="#fff" stroke="#a0aec0" stroke-dasharray="4 3"/>
  <text class="t" x="548" y="182" style="fill:#4a5568">OpenAI API</text><text class="s" x="548" y="198">fetch + streaming</text>
  <rect x="616" y="164" width="120" height="44" rx="8" fill="#fff" stroke="#a0aec0" stroke-dasharray="4 3"/>
  <text class="t" x="676" y="182" style="fill:#4a5568">compatible</text><text class="s" x="676" y="198">any OpenAI-style URL</text>
  <rect x="488" y="216" width="248" height="32" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text class="s" x="612" y="229" style="fill:#2d3748; font-weight:600">fetch from the service worker, key in storage</text>
  <text class="s" x="612" y="242">no chat page: needs a place to show the answer</text>
</svg>
