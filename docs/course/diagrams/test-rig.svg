<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .t { font: 700 10px 'Segoe UI', sans-serif; text-anchor: middle; }
    .f { font: 8.5px 'Cascadia Mono', Consolas, monospace; fill: #6b46c1; text-anchor: middle; }
    .s { font: 8.5px 'Segoe UI', sans-serif; fill: #4a5568; text-anchor: middle; }
    .e { font: 8.5px 'Segoe UI', sans-serif; fill: #2d3748; }
  </style>

  <rect x="12" y="20" width="130" height="50" rx="8" fill="#fff" stroke="#a0aec0"/>
  <text class="t" x="77" y="38" style="fill:#2d3748">TTS speaker</text>
  <text class="f" x="77" y="52">tools/tts/speak.ps1</text>
  <text class="s" x="77" y="64">reads interview scripts</text>

  <rect x="172" y="20" width="130" height="50" rx="8" fill="#fff3ea" stroke="#c05621"/>
  <text class="t" x="237" y="40" style="fill:#7b341e">Live Captions</text>
  <text class="s" x="237" y="56">real recognition,</text>
  <text class="s" x="237" y="66">real rewrites</text>

  <rect x="332" y="20" width="150" height="50" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.4"/>
  <text class="t" x="407" y="40" style="fill:#1a4971">CaptionRelay app</text>
  <text class="s" x="407" y="56">the real build</text>
  <text class="s" x="407" y="66">(published exe in Phase 11)</text>

  <rect x="332" y="110" width="150" height="50" rx="8" fill="#fff" stroke="#a0aec0"/>
  <text class="t" x="407" y="128" style="fill:#2d3748">Key / UI scripts</text>
  <text class="f" x="407" y="142">tools/keytest/*.ps1</text>
  <text class="s" x="407" y="154">keys only to a test window</text>

  <rect x="520" y="10" width="228" height="34" rx="8" fill="#eaf7ef" stroke="#2f855a"/>
  <text class="t" x="634" y="26" style="fill:#1c5235">real Chrome + extension + Gemini</text>
  <text class="s" x="634" y="38">live tests, measured timings</text>
  <rect x="520" y="54" width="228" height="34" rx="8" fill="#fff" stroke="#2f855a" stroke-dasharray="4 3"/>
  <text class="t" x="634" y="70" style="fill:#1c5235">RelayTestClient (fake extension)</text>
  <text class="s" x="634" y="82">answers sent / queued / error / nothing</text>

  <rect x="12" y="110" width="130" height="50" rx="8" fill="#fff" stroke="#a0aec0"/>
  <text class="t" x="77" y="128" style="fill:#2d3748">Caption recorder</text>
  <text class="f" x="77" y="142">tools/CaptionRecorder</text>
  <text class="s" x="77" y="154">every snapshot + time</text>

  <rect x="172" y="110" width="130" height="50" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
  <text class="t" x="237" y="128" style="fill:#2d3748">Fixtures</text>
  <text class="f" x="237" y="142">*.jsonl.gz</text>
  <text class="s" x="237" y="154">recorded once</text>

  <rect x="172" y="182" width="130" height="36" rx="8" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text class="t" x="237" y="198" style="fill:#1a4971">ReplayTests</text>
  <text class="s" x="237" y="210">replayed on every test run</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="142" y1="45" x2="171" y2="45"/>
    <line x1="302" y1="45" x2="331" y2="45"/>
    <line x1="407" y1="109" x2="407" y2="71"/>
    <path d="M482,38 C500,30 505,27 519,27"/>
    <path d="M482,52 C500,62 505,71 519,71"/>
    <path d="M237,70 C237,90 120,90 90,109"/>
    <line x1="142" y1="135" x2="171" y2="135"/>
    <line x1="237" y1="160" x2="237" y2="181"/>
  </g>
  <text class="e" x="148" y="38">audio</text>
  <text class="e" x="306" y="38">UIA</text>
  <text class="e" x="412" y="92">Ctrl+Shift, F9, clicks</text>
  <text class="e" x="246" y="92">same UIA reads</text>

  <rect x="520" y="110" width="228" height="108" rx="9" fill="#fffaeb" stroke="#d69e2e"/>
  <text x="532" y="128" style="font: 700 9.5px 'Segoe UI'; fill: #b7791f">why this rig</text>
  <text class="e" x="532" y="146">• repeatable speech: the same script every run</text>
  <text class="e" x="532" y="162">• real input, recorded once, replayed forever</text>
  <text class="e" x="532" y="178">• a fake extension makes every failure</text>
  <text class="e" x="542" y="191">path easy to trigger on purpose</text>
  <text class="e" x="532" y="207">• no test touches the user's own windows</text>
</svg>
