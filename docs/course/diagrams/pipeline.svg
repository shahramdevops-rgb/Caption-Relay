<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
  </defs>
  <style>
    .zl { font: 700 9.5px 'Segoe UI', sans-serif; letter-spacing: 1px; }
    .t { font: 700 11px 'Segoe UI', sans-serif; text-anchor: middle; }
    .s { font: 9.5px 'Segoe UI', sans-serif; fill: #4a5568; text-anchor: middle; }
    .n { font: 700 9.5px 'Segoe UI', sans-serif; fill: #fff; text-anchor: middle; }
    .lbl { font: 9.5px 'Segoe UI', sans-serif; fill: #2f855a; text-anchor: middle; }
  </style>

  <!-- zones -->
  <rect x="8" y="24" width="176" height="166" rx="12" fill="#fff8f2" stroke="#f3d3bd"/>
  <text class="zl" x="18" y="40" fill="#c05621">WINDOWS</text>
  <rect x="192" y="24" width="278" height="166" rx="12" fill="#f4f8fe" stroke="#c9dcf3"/>
  <text class="zl" x="202" y="40" fill="#2b6cb0">CAPTIONRELAY APP · C# .NET 8</text>
  <rect x="478" y="24" width="274" height="166" rx="12" fill="#f3faf5" stroke="#c5e5cf"/>
  <text class="zl" x="488" y="40" fill="#2f855a">CHROME · MV3 EXTENSION</text>
  <rect x="567" y="50" width="179" height="134" rx="9" fill="#f7f3ff" stroke="#d8cbf5" stroke-dasharray="4 3"/>
  <text x="656" y="59" style="font: 600 8.5px 'Segoe UI'; fill: #6b46c1; text-anchor: middle">gemini.google.com tab</text>

  <!-- boxes -->
  <g>
    <rect x="18" y="62" width="76" height="74" rx="8" fill="#fff" stroke="#c05621" stroke-width="1.4"/>
    <text class="t" x="56" y="88" fill="#7b341e">Speech</text>
    <text class="s" x="56" y="104">system audio</text>
    <text class="s" x="56" y="117">(other person)</text>

    <rect x="100" y="62" width="76" height="74" rx="8" fill="#fff" stroke="#c05621" stroke-width="1.4"/>
    <text class="t" x="138" y="88" fill="#7b341e">Live</text>
    <text class="t" x="138" y="101" fill="#7b341e">Captions</text>
    <text class="s" x="138" y="117">rolling window</text>

    <rect x="198" y="62" width="80" height="74" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="1.4"/>
    <text class="t" x="238" y="88" fill="#1a4971">Captions</text>
    <text class="t" x="238" y="101" fill="#1a4971">Reader</text>
    <text class="s" x="238" y="117">UI Automation</text>
    <text class="s" x="238" y="129">every 120 ms</text>

    <rect x="291" y="62" width="80" height="74" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="1.4"/>
    <text class="t" x="331" y="88" fill="#1a4971">Transcript</text>
    <text class="s" x="331" y="104">merge snapshots</text>
    <text class="s" x="331" y="117">+ sentIndex</text>

    <rect x="384" y="62" width="80" height="74" rx="8" fill="#fff" stroke="#2b6cb0" stroke-width="1.4"/>
    <text class="t" x="424" y="88" fill="#1a4971">RelayServer</text>
    <text class="s" x="424" y="104">loopback</text>
    <text class="s" x="424" y="117">WebSocket</text>

    <rect x="482" y="62" width="80" height="74" rx="8" fill="#fff" stroke="#2f855a" stroke-width="1.4"/>
    <text class="t" x="522" y="88" fill="#1c5235">Service</text>
    <text class="t" x="522" y="101" fill="#1c5235">worker</text>
    <text class="s" x="522" y="117">+ registry</text>

    <rect x="575" y="62" width="80" height="74" rx="8" fill="#fff" stroke="#6b46c1" stroke-width="1.4"/>
    <text class="t" x="615" y="88" fill="#44337a">Content</text>
    <text class="t" x="615" y="101" fill="#44337a">script</text>
    <text class="s" x="615" y="117">web-chat module</text>

    <rect x="668" y="62" width="72" height="74" rx="8" fill="#fff" stroke="#6b46c1" stroke-width="1.4"/>
    <text class="t" x="704" y="88" fill="#44337a">Gemini</text>
    <text class="s" x="704" y="104">insert, submit,</text>
    <text class="s" x="704" y="117">verify</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#4a5568" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="94" y1="99" x2="99" y2="99"/>
    <line x1="176" y1="99" x2="197" y2="99"/>
    <line x1="278" y1="99" x2="290" y2="99"/>
    <line x1="371" y1="99" x2="383" y2="99"/>
    <line x1="464" y1="99" x2="481" y2="99"/>
    <line x1="562" y1="99" x2="574" y2="99"/>
    <line x1="655" y1="99" x2="667" y2="99"/>
    <line x1="331" y1="213" x2="331" y2="138"/>
  </g>

  <!-- ack path -->
  <path d="M704,136 V158 H424 V139" fill="none" stroke="#2f855a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text class="lbl" x="742" y="174" style="text-anchor: end">ack: sent / queued / error  ·  result  ·  log</text>

  <!-- hotkey -->
  <rect x="283" y="214" width="96" height="38" rx="8" fill="#1f2937"/>
  <text x="331" y="231" style="font: 700 11.5px 'Cascadia Mono', Consolas, monospace; fill: #fff; text-anchor: middle">Ctrl+Shift</text>
  <text x="331" y="245" style="font: 9px 'Segoe UI'; fill: #cbd5e0; text-anchor: middle">you press the hotkey</text>
  <text x="340" y="180" style="font: 9.5px 'Segoe UI'; fill: #4a5568">Take()</text>

  <!-- step numbers -->
  <g>
    <circle cx="97" cy="148" r="8" fill="#c05621"/><text class="n" x="97" y="151.5">1</text>
    <circle cx="187" cy="148" r="8" fill="#c05621"/><text class="n" x="187" y="151.5">2</text>
    <circle cx="284.5" cy="148" r="8" fill="#2b6cb0"/><text class="n" x="284.5" y="151.5">3</text>
    <circle cx="318" cy="198" r="8" fill="#2b6cb0"/><text class="n" x="318" y="201.5">4</text>
    <circle cx="377.5" cy="148" r="8" fill="#2b6cb0"/><text class="n" x="377.5" y="151.5">5</text>
    <circle cx="473" cy="148" r="8" fill="#2f855a"/><text class="n" x="473" y="151.5">6</text>
    <circle cx="568.5" cy="148" r="8" fill="#6b46c1"/><text class="n" x="568.5" y="151.5">7</text>
    <circle cx="661.5" cy="148" r="8" fill="#6b46c1"/><text class="n" x="661.5" y="151.5">8</text>
    <circle cx="444" cy="158" r="8" fill="#2f855a"/><text class="n" x="444" y="161.5">9</text>
  </g>
</svg>
