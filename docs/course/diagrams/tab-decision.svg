<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .t { font: 9.5px 'Segoe UI', sans-serif; fill: #1a202c; text-anchor: middle; }
    .tb { font: 700 9.5px 'Segoe UI', sans-serif; text-anchor: middle; }
    .y { font: 600 9px 'Segoe UI', sans-serif; fill: #2f855a; }
    .n { font: 600 9px 'Segoe UI', sans-serif; fill: #c53030; }
    .d { fill: #fff; stroke: #4a5568; stroke-width: 1.2; }
  </style>

  <rect x="20" y="8" width="290" height="28" rx="14" fill="#2d3748"/>
  <text class="t" x="165" y="26" style="fill:#fff; font-weight:600">deliver(text) in the service worker</text>
  <rect class="d" x="20" y="50" width="290" height="28" rx="7"/>
  <text class="t" x="165" y="68">does a tab hold queued text?</text>
  <rect class="d" x="20" y="92" width="290" height="28" rx="7"/>
  <text class="t" x="165" y="110">most recently used Gemini tab?</text>
  <rect x="20" y="134" width="290" height="28" rx="7" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text class="t" x="165" y="152">mark it not auto-discardable (Memory Saver)</text>
  <rect class="d" x="20" y="176" width="290" height="28" rx="7"/>
  <text class="t" x="165" y="194">discarded by Chrome?</text>
  <rect class="d" x="20" y="218" width="290" height="28" rx="7"/>
  <text class="t" x="165" y="236">content script answers a ping within 1 s?</text>
  <rect x="20" y="260" width="290" height="40" rx="7" fill="#eaf7ef" stroke="#38a169"/>
  <text class="tb" x="165" y="276" style="fill:#2f855a">deliver in the page → ack</text>
  <text class="t" x="165" y="291" style="font-size:8.5px; fill:#4a5568">sent, queued (chat busy) or error</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <line x1="165" y1="36" x2="165" y2="49"/>
    <line x1="165" y1="78" x2="165" y2="91"/>
    <line x1="165" y1="120" x2="165" y2="133"/>
    <line x1="165" y1="162" x2="165" y2="175"/>
    <line x1="165" y1="204" x2="165" y2="217"/>
    <line x1="165" y1="246" x2="165" y2="259"/>
    <path d="M310,64 H340 V140 H311"/>
    <path d="M310,106 H399"/>
    <path d="M310,190 H399"/>
    <path d="M310,232 H360 V202 H399"/>
  </g>
  <text class="y" x="316" y="58">yes</text>
  <text class="n" x="172" y="88">no</text>
  <text class="y" x="172" y="130">found</text>
  <text class="n" x="316" y="100">none</text>
  <text class="y" x="316" y="184">yes</text>
  <text class="n" x="172" y="214">no</text>
  <text class="n" x="316" y="226">no (frozen)</text>
  <text class="y" x="172" y="256">yes</text>

  <rect x="400" y="88" width="340" height="44" rx="8" fill="#fffaeb" stroke="#d69e2e"/>
  <text class="tb" x="570" y="105" style="fill:#975a16">open a new chat in a background tab</text>
  <text class="t" x="570" y="121" style="font-size:8.5px; fill:#4a5568">ack "queued" now · deliver after it loads · result later</text>
  <rect x="400" y="172" width="340" height="44" rx="8" fill="#fffaeb" stroke="#d69e2e"/>
  <text class="tb" x="570" y="189" style="fill:#975a16">reload the tab (the chat is kept by Google)</text>
  <text class="t" x="570" y="205" style="font-size:8.5px; fill:#4a5568">ack "queued" now · deliver after load · result later</text>

  <rect x="400" y="238" width="340" height="62" rx="8" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="412" y="256" style="font: 700 9.5px 'Segoe UI'; fill: #4a5568">not needed: focus or visibility</text>
  <text x="412" y="272" style="font: 9px 'Segoe UI'; fill: #4a5568">execCommand and a click work in a hidden tab, behind</text>
  <text x="412" y="286" style="font: 9px 'Segoe UI'; fill: #4a5568">other tabs or in a minimized window (tested)</text>
</svg>
