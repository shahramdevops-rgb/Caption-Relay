<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    .t { font: 700 11px 'Segoe UI', sans-serif; text-anchor: middle; }
    .s { font: 9px 'Segoe UI', sans-serif; fill: #4a5568; text-anchor: middle; }
    .e { font: 9.5px 'Segoe UI', sans-serif; fill: #2d3748; }
    .k { font: 600 9px 'Cascadia Mono', Consolas, monospace; fill: #6b46c1; }
  </style>

  <!-- states -->
  <rect x="20" y="96" width="120" height="50" rx="25" fill="#f7fafc" stroke="#4a5568" stroke-width="1.4"/>
  <text class="t" x="80" y="117" style="fill:#2d3748">Idle</text>
  <text class="s" x="80" y="132">no modifier held</text>

  <rect x="230" y="96" width="140" height="50" rx="25" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.4"/>
  <text class="t" x="300" y="117" style="fill:#1a4971">Armed</text>
  <text class="s" x="300" y="132">Ctrl and Shift both down</text>

  <rect x="470" y="96" width="140" height="50" rx="25" fill="#eaf7ef" stroke="#38a169" stroke-width="1.4"/>
  <text class="t" x="540" y="117" style="fill:#2f855a">Fired</text>
  <text class="s" x="540" y="132">once per press</text>

  <rect x="230" y="200" width="140" height="50" rx="25" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.4"/>
  <text class="t" x="300" y="221" style="fill:#c53030">Spoiled</text>
  <text class="s" x="300" y="236">another key was pressed</text>

  <!-- send action -->
  <rect x="650" y="100" width="96" height="42" rx="8" fill="#2d3748"/>
  <text class="t" x="698" y="118" style="fill:#fff">SEND</text>
  <text class="s" x="698" y="132" style="fill:#cbd5e0">→ UI thread</text>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <path d="M140,121 H229"/>
    <path d="M370,121 H469"/>
    <path d="M610,121 H649"/>
    <path d="M540,96 C540,40 80,40 80,95"/>
    <path d="M300,146 V199"/>
    <path d="M230,225 C120,225 80,190 80,147"/>
  </g>
  <text class="e" x="148" y="114">both down</text>
  <text class="e" x="148" y="140">any order</text>
  <text class="e" x="380" y="114">a modifier</text>
  <text class="e" x="380" y="140">released</text>
  <text class="e" x="250" y="34">both released → start again</text>
  <text class="e" x="308" y="170">any other key</text>
  <text class="k" x="308" y="182">Ctrl+Shift+T</text>
  <text class="e" x="94" y="246">both released</text>

  <rect x="430" y="176" width="316" height="78" rx="9" fill="#fffaeb" stroke="#d69e2e"/>
  <text x="442" y="194" style="font: 700 10px 'Segoe UI'; fill: #b7791f">rules that avoid stuck state</text>
  <text class="e" x="442" y="210">• key state comes from the event + GetAsyncKeyState</text>
  <text class="e" x="442" y="225">• a new press with nothing held resets everything</text>
  <text class="e" x="442" y="240">• auto-repeat (key already down) is ignored</text>
</svg>
