<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CaptionRelay fake chat test</title>
  <style>
    body { font: 14px "Segoe UI", sans-serif; margin: 16px; }
    .ql-editor { border: 1px solid #888; min-height: 40px; padding: 6px; }
    #stage { border: 1px dashed #aaa; padding: 8px; margin-bottom: 12px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Web-chat delivery tests (fake Gemini, ChatGPT and Claude pages)</h1>
  <div id="stage"></div>
  <pre id="results">running…</pre>

  <script src="../../extension/providers/gemini/selectors.js"></script>
  <script src="../../extension/providers/chatgpt/selectors.js"></script>
  <script src="../../extension/providers/claude/selectors.js"></script>
  <script src="../../extension/providers/webchat.js"></script>
  <script>
    // Builds a Gemini-like page. Options change how the fake behaves.
    function build(o = {}) {
      const stage = document.getElementById('stage');
      stage.innerHTML = '';
      const area = document.createElement('input-area-v2');
      const rt = document.createElement('rich-textarea');
      const box = document.createElement('div');
      box.className = 'ql-editor';
      box.contentEditable = 'true';
      if (o.noInput) box.contentEditable = 'false';
      rt.appendChild(box);
      area.appendChild(rt);
      const btn = document.createElement('button');
      btn.textContent = 'send';
      btn.className = o.real ? '' : (o.buttonClass ?? 'send-button');
      if (o.ariaLabel) btn.setAttribute('aria-label', o.ariaLabel);
      btn.disabled = true;
      let gem = null;
      if (o.real) {
        // Live Gemini structure (2026-11-12): <gem-icon-button class="send-button has-input submit"><button aria-label="Send message">
        gem = document.createElement('gem-icon-button');
        gem.className = o.busy ? 'send-button stop' : 'send-button has-input submit';
        btn.setAttribute('aria-label', o.busy ? 'Stop response' : 'Send message');
        gem.appendChild(btn);
        area.appendChild(gem);
      } else {
        area.appendChild(btn);
      }
      const chat = document.createElement('div');
      stage.append(chat, area);
      if (o.draft) box.innerHTML = `<p>${o.draft}</p>`;

      const update = () => { if (!o.busy) btn.disabled = box.innerText.trim() === ''; };
      box.addEventListener('input', update);
      update();
      if (o.busy && !o.real) btn.className = 'send-button stop';
      if (o.busy && o.real) btn.disabled = false;

      btn.addEventListener('click', () => {
        if (o.ignoreClicks || btn.classList.contains('stop') || gem?.classList.contains('stop')) {
          if (gem?.classList.contains('stop')) window.__stopClicked = true;
          return;
        }
        const q = document.createElement('user-query');
        q.textContent = box.innerText.trim();
        chat.appendChild(q);
        box.innerHTML = '';
        update();
      });
      if (o.breakExecCommand) document.execCommand = () => false;
      // Gemini finishes answering: the stop button turns back into the send button.
      const endBusy = () => {
        o.busy = false;
        if (gem) {
          gem.className = 'send-button has-input submit';
          btn.setAttribute('aria-label', 'Send message');
        } else {
          btn.className = 'send-button';
        }
        update();
      };
      return { box, btn, chat, endBusy };
    }

    const sel = globalThis.CaptionRelaySelectors.gemini;
    const chatApi = globalThis.CaptionRelayWebChat;
    const realExec = document.execCommand.bind(document);
    const results = [];
    async function check(name, fn) {
      document.execCommand = realExec;
      try {
        const detail = await fn();
        results.push(`PASS ${name}${detail ? ' — ' + detail : ''}`);
      } catch (e) {
        results.push(`FAIL ${name} — ${e.message}`);
      }
    }
    function expect(cond, msg) { if (!cond) throw new Error(msg); }
    const turns = (p) => [...p.chat.querySelectorAll('user-query')].map((q) => q.textContent);

    (async () => {
      await check('empty box: inserted, submitted, verified', async () => {
        const p = build();
        const ack = await chatApi.deliver(sel, 'Hello there, what is a delegate?');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(turns(p)[0] === 'Hello there, what is a delegate?', 'turn: ' + turns(p)[0]);
        return ack.detail;
      });

      await check('live Gemini structure (gem-icon-button.send-button) → sent via the structural selector', async () => {
        const p = build({ real: true });
        const ack = await chatApi.deliver(sel, 'real structure test');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(/gem-icon-button\.send-button:not\(\.stop\) button/.test(ack.detail), ack.detail);
        expect(turns(p)[0] === 'real structure test', 'turn: ' + turns(p)[0]);
        return ack.detail;
      });

      await check('live Gemini structure while answering (gem-icon-button.stop) → busy, stop never clicked', async () => {
        window.__stopClicked = false;
        const p = build({ real: true, busy: true });
        const ack = await chatApi.deliver(sel, 'must wait');
        expect(ack.status === 'busy', JSON.stringify(ack));
        expect(!window.__stopClicked, 'stop was clicked');
        expect(p.box.innerText.trim() === '', 'box: ' + p.box.innerText);
      });

      await check("user's draft is kept and sent before our text", async () => {
        const p = build({ draft: 'My own draft question' });
        const ack = await chatApi.deliver(sel, 'caption text from the interviewer');
        expect(ack.status === 'sent', JSON.stringify(ack));
        const t = turns(p)[0];
        expect(/^My own draft question caption text from the interviewer$/.test(t), 'turn: ' + JSON.stringify(t));
        return ack.detail;
      });

      await check('multi-line text keeps its lines', async () => {
        const p = build();
        const ack = await chatApi.deliver(sel, 'line one\n\nline two');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(/line one\s+line two/.test(turns(p)[0]), 'turn: ' + JSON.stringify(turns(p)[0]));
      });

      await check('busy (stop button shown) → status busy, nothing inserted', async () => {
        const p = build({ busy: true });
        const ack = await chatApi.deliver(sel, 'should wait');
        expect(ack.status === 'busy', JSON.stringify(ack));
        expect(p.box.innerText.trim() === '', 'box: ' + p.box.innerText);
      });

      await check('no input → "input not found"', async () => {
        build({ noInput: true });
        const ack = await chatApi.deliver(sel, 'x', { inputWaitMs: 300 });
        expect(ack.status === 'error' && ack.detail === 'input not found', JSON.stringify(ack));
      });

      await check('Persian aria-label only (no class) → button found', async () => {
        const p = build({ buttonClass: '', ariaLabel: 'ارسال پیام' });
        const ack = await chatApi.deliver(sel, 'persian label test');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(turns(p).length === 1, 'turns: ' + turns(p).length);
        return ack.detail;
      });

      await check('unknown button → closest button in the container is used', async () => {
        const p = build({ buttonClass: 'mystery-submit' });
        const ack = await chatApi.deliver(sel, 'closest button test', { buttonWaitMs: 300 });
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(/closest button/.test(ack.detail), ack.detail);
        expect(turns(p).length === 1, 'turns: ' + turns(p).length);
        return ack.detail;
      });

      await check('only a microphone-like button → never clicked, Enter is tried, error reported', async () => {
        const p = build({ buttonClass: 'mic-button', ariaLabel: 'Use microphone' });
        let clicked = false;
        p.btn.addEventListener('click', () => (clicked = true), true);
        const ack = await chatApi.deliver(sel, 'must not click the mic', { buttonWaitMs: 300, verifyMs: 300 });
        expect(!clicked, 'the microphone button was clicked');
        expect(ack.status === 'error' && ack.detail === 'send button not found', JSON.stringify(ack));
      });

      await check('execCommand broken → fallback insert still works', async () => {
        const p = build({ breakExecCommand: true });
        const ack = await chatApi.deliver(sel, 'fallback insert test');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(!/^execCommand/.test(ack.detail), ack.detail);
        expect(turns(p)[0] === 'fallback insert test', 'turn: ' + turns(p)[0]);
        return ack.detail;
      });

      await check('click does nothing → error "message did not appear after submit"', async () => {
        build({ ignoreClicks: true });
        const ack = await chatApi.deliver(sel, 'ignored', { verifyMs: 400 });
        expect(ack.status === 'error' && ack.detail === 'message did not appear after submit', JSON.stringify(ack));
      });

      // ---- Phase 9: queue while answering ----
      const waitFor = async (cond, ms = 3000) => { const end = Date.now() + ms; while (!cond() && Date.now() < end) await new Promise((r) => setTimeout(r, 20)); return cond(); };

      await check('not answering → deliverOrQueue sends at once (no result callback)', async () => {
        const p = build({ real: true });
        const results = [];
        const ack = await chatApi.deliverOrQueue(sel, 'direct send', 'id-1', { onResult: (ids, a) => results.push([ids, a.status]) });
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(results.length === 0, 'unexpected result');
        expect(turns(p)[0] === 'direct send', 'turn: ' + turns(p)[0]);
      });

      await check('answering → queued, submitted when the answer ends, result reported', async () => {
        const p = build({ real: true, busy: true });
        const results = [];
        const ack = await chatApi.deliverOrQueue(sel, 'wait for the answer', 'id-2', { onResult: (ids, a) => results.push([ids.join(','), a.status]), settleMs: 50 });
        expect(ack.status === 'queued', JSON.stringify(ack));
        await new Promise((r) => setTimeout(r, 300));
        expect(turns(p).length === 0, 'submitted while answering!');
        p.endBusy();
        expect(await waitFor(() => results.length === 1), 'no result');
        expect(results[0][0] === 'id-2' && results[0][1] === 'sent', JSON.stringify(results));
        expect(turns(p)[0] === 'wait for the answer', 'turn: ' + turns(p)[0]);
        return 'stop button never clicked: ' + !window.__stopClicked;
      });

      await check('two sends while answering → merged into ONE message, a space between them', async () => {
        window.__stopClicked = false;
        const p = build({ real: true, busy: true });
        const results = [];
        const onResult = (ids, a) => results.push([ids.join(','), a.status]);
        const a1 = await chatApi.deliverOrQueue(sel, 'first part', 'id-3', { onResult, settleMs: 50 });
        const a2 = await chatApi.deliverOrQueue(sel, 'second part', 'id-4', { onResult, settleMs: 50 });
        expect(a1.status === 'queued' && a2.status === 'queued', JSON.stringify([a1, a2]));
        expect(/2 queued/.test(a2.detail), a2.detail);
        p.endBusy();
        expect(await waitFor(() => results.length === 1), 'no result');
        expect(results[0][0] === 'id-3,id-4' && results[0][1] === 'sent', JSON.stringify(results));
        expect(turns(p).length === 1, 'turns: ' + turns(p).length);
        expect(/^first part second part$/.test(turns(p)[0]), 'turn: ' + JSON.stringify(turns(p)[0]));
        expect(!window.__stopClicked, 'stop clicked');
      });

      await check('answer never ends → given up after maxWait, error result', async () => {
        const p = build({ real: true, busy: true });
        const results = [];
        await chatApi.deliverOrQueue(sel, 'never sent', 'id-5', { onResult: (ids, a) => results.push([ids.join(','), a.status, a.detail]), maxWaitMs: 400, pollMs: 50 });
        expect(await waitFor(() => results.length === 1, 2000), 'no result');
        expect(results[0][0] === 'id-5' && results[0][1] === 'error', JSON.stringify(results));
        expect(turns(p).length === 0, 'submitted');
        expect(chatApi.queueLength() === 0, 'queue not empty');
        return results[0][2];
      });

      // ---- Paste only (default): insert, never submit ----
      await check('paste only: inserted after the draft, nothing clicked', async () => {
        const p = build({ real: true, draft: 'My own draft' });
        const ack = await chatApi.deliver(sel, 'pasted caption text', { submit: false });
        expect(ack.status === 'sent' && ack.submitted === false, JSON.stringify(ack));
        expect(turns(p).length === 0, 'submitted!');
        expect(/^My own draft pasted caption text$/.test(p.box.innerText.trim()), 'box: ' + JSON.stringify(p.box.innerText));
        return ack.detail;
      });

      await check('paste only while answering: pasted at once, not queued, stop never clicked', async () => {
        window.__stopClicked = false;
        const p = build({ real: true, busy: true });
        const results = [];
        const ack = await chatApi.deliverOrQueue(sel, 'paste during answer', 'id-p', { submit: false, onResult: (ids, a) => results.push(a) });
        expect(ack.status === 'sent' && ack.submitted === false, JSON.stringify(ack));
        expect(p.box.innerText.trim() === 'paste during answer', 'box: ' + p.box.innerText);
        expect(chatApi.queueLength() === 0, 'queued');
        expect(!window.__stopClicked, 'stop clicked');
        p.endBusy();
        await new Promise((r) => setTimeout(r, 400));
        expect(turns(p).length === 0 && results.length === 0, 'submitted after the answer');
      });

      await check('paste only: the start already at the end of the input is left out', async () => {
        const p = build({ real: true, draft: 'Tell me about your last project.' });
        const ack = await chatApi.deliver(sel, 'about your last project and the team size', { submit: false });
        expect(ack.status === 'sent' && !ack.alreadyInInput, JSON.stringify(ack));
        expect(p.box.innerText.trim() === 'Tell me about your last project. and the team size', 'box: ' + JSON.stringify(p.box.innerText));
      });

      await check('paste only: the input has the focus afterwards, caret at the end', async () => {
        const p = build({ real: true, draft: 'already here' });
        document.body.focus();
        await chatApi.deliver(sel, 'and the new words', { submit: false });
        expect(document.activeElement === p.box, 'focus on ' + (document.activeElement?.tagName ?? 'nothing'));
        const s = window.getSelection();
        expect(s.isCollapsed && p.box.contains(s.focusNode), 'caret not in the box');
        const tail = document.createRange();
        tail.setStart(s.focusNode, s.focusOffset);
        tail.setEnd(p.box, p.box.childNodes.length);
        expect(tail.toString().trim() === '', 'caret not at the end: ' + JSON.stringify(tail.toString()));
      });

      await check('paste only: a long paste is scrolled to its end (last words in view), also inside a wrapper', async () => {
        const p = build({ real: true });
        p.box.style.maxHeight = '40px';
        p.box.style.overflowY = 'auto';
        const wrapper = p.box.parentElement;
        wrapper.style.maxHeight = '60px';
        wrapper.style.overflowY = 'auto';
        const many = Array.from({ length: 200 }, (_, i) => 'w' + (i + 1)).join(' ');
        await chatApi.deliver(sel, many, { submit: false });
        await new Promise((r) => setTimeout(r, 120)); // the second scroll (after re-render)
        const atEnd = (el) => el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
        expect(p.box.scrollHeight > p.box.clientHeight, 'box does not scroll; test is wrong');
        expect(atEnd(p.box), `box at ${p.box.scrollTop} of ${p.box.scrollHeight - p.box.clientHeight}`);
        expect(wrapper.scrollHeight <= wrapper.clientHeight + 1 || atEnd(wrapper), 'wrapper not at its end');
        p.box.style.maxHeight = p.box.style.overflowY = wrapper.style.maxHeight = wrapper.style.overflowY = '';
      });

      await check('paste only: all of it already in the input → nothing added, alreadyInInput', async () => {
        const p = build({ real: true, draft: 'what is a delegate in C sharp' });
        const ack = await chatApi.deliver(sel, 'What is a delegate in C sharp?', { submit: false });
        expect(ack.status === 'sent' && ack.alreadyInInput === true, JSON.stringify(ack));
        expect(p.box.innerText.trim() === 'what is a delegate in C sharp', 'box: ' + JSON.stringify(p.box.innerText));
      });

      const ws = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => 'w' + (a + i)).join(' ');

      await check('mergeText: newer words appended, older words (more taps) put in front, nothing twice', async () => {
        const m = chatApi.mergeText;
        const eq = (got, want, what) => expect(got === want, `${what}: ${JSON.stringify(got)}`);
        eq(m('', 'a b c'), 'a b c', 'empty input');
        eq(m(ws(1, 5), ws(2, 7)), ws(1, 7), 'newer words');
        eq(m(ws(26, 40), ws(11, 40)), ws(11, 40), 'tap 1 then 2 more taps: older words in front');
        eq(m(ws(26, 40), ws(1, 42)), ws(1, 42), 'older and newer');
        eq(m('My note. ' + ws(5, 7), ws(1, 7)), 'My note. ' + ws(1, 7), 'own draft stays in front');
        eq(m(ws(1, 60), ws(46, 60)), null, 'all already there (inside a long paste)');
        eq(m(ws(26, 40), ws(26, 40)), null, 'same words again');
        eq(m('my own note', 'totally different text'), 'my own note totally different text', 'no overlap');
        eq(m('I said please', 'please do it'), 'I said please please do it', 'one shared word is chance');
      });

      await check('paste only: 1 tap, then 3 taps → the older words go in front, nothing twice', async () => {
        const p = build({ real: true });
        const a1 = await chatApi.deliver(sel, ws(31, 45), { submit: false });
        const a2 = await chatApi.deliver(sel, ws(1, 45), { submit: false });
        expect(a1.status === 'sent' && a2.status === 'sent' && !a2.alreadyInInput, JSON.stringify([a1, a2]));
        expect(p.box.innerText.trim() === ws(1, 45), 'box: ' + JSON.stringify(p.box.innerText));
        const a3 = await chatApi.deliver(sel, ws(31, 45), { submit: false });
        expect(a3.alreadyInInput === true, JSON.stringify(a3));
      });

      await check('paste twice: both texts in the box, one after the other', async () => {
        const p = build({ real: true });
        await chatApi.deliver(sel, 'first words', { submit: false });
        const ack = await chatApi.deliver(sel, 'second words', { submit: false });
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(/^first words second words$/.test(p.box.innerText.trim()), 'box: ' + JSON.stringify(p.box.innerText));
        expect(turns(p).length === 0, 'submitted!');
      });

      // ---- Tap key held: merged with the input, then sent ----
      await check('held tap: merged with what the input holds (nothing twice), then sent', async () => {
        const p = build({ real: true });
        await chatApi.deliver(sel, ws(11, 25), { submit: false });
        const ack = await chatApi.deliver(sel, ws(1, 25), { submit: true, merge: true });
        expect(ack.status === 'sent' && ack.submitted !== false, JSON.stringify(ack));
        expect(turns(p).length === 1 && turns(p)[0] === ws(1, 25), 'turns: ' + JSON.stringify(turns(p)));
      });

      await check('held tap, all already in the input: just sent', async () => {
        const p = build({ real: true });
        await chatApi.deliver(sel, ws(1, 15), { submit: false });
        const ack = await chatApi.deliver(sel, ws(1, 15), { submit: true, merge: true });
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(turns(p).length === 1 && turns(p)[0] === ws(1, 15), 'turns: ' + JSON.stringify(turns(p)));
      });

      await check('held tap while answering: pasted at once, sent when the answer ends', async () => {
        window.__stopClicked = false;
        const p = build({ real: true, busy: true });
        const results = [];
        const ack = await chatApi.deliverOrQueue(sel, ws(1, 15), 'id-h', { submit: true, merge: true, settleMs: 50, onResult: (ids, a) => results.push([ids.join(','), a.status]) });
        expect(ack.status === 'queued', JSON.stringify(ack));
        expect(p.box.innerText.trim() === ws(1, 15), 'box: ' + JSON.stringify(p.box.innerText));
        expect(turns(p).length === 0, 'sent while answering');
        p.endBusy();
        expect(await waitFor(() => results.length === 1), 'no result');
        expect(results[0][0] === 'id-h' && results[0][1] === 'sent', JSON.stringify(results));
        expect(turns(p).length === 1 && turns(p)[0] === ws(1, 15), 'turns: ' + JSON.stringify(turns(p)));
        expect(!window.__stopClicked, 'stop clicked');
      });

      await check('Test: inserts without submitting and reports selectors', async () => {
        const p = build();
        const r = await chatApi.test(sel, 'CaptionRelay test');
        expect(r.ok, JSON.stringify(r));
        expect(p.box.innerText.trim() === 'CaptionRelay test', 'box: ' + p.box.innerText);
        expect(turns(p).length === 0, 'submitted!');
        expect(r.report.input === 'rich-textarea div.ql-editor[contenteditable="true"]', 'input selector: ' + r.report.input);
        return r.detail;
      });

      // ---- Phase 13: ChatGPT-like page ----
      // Structure as on chatgpt.com (2026-11-13): <form data-chatgpt-composer> with a ProseMirror
      // <div contenteditable role="textbox">, a dictate button and one round button (size-token-button-composer):
      // "Start Voice" while the box is empty, type="submit" "Send" with text, type="button" "Stop" while answering.
      // No ids or data-testids. A hidden textarea is added to check that invisible editors are skipped.
      function buildGpt(o = {}) {
        const stage = document.getElementById('stage');
        stage.innerHTML = '';
        const chat = document.createElement('div');
        const form = document.createElement('form');
        form.setAttribute('data-chatgpt-composer', '');
        form.addEventListener('submit', (e) => e.preventDefault());
        const hidden = document.createElement('textarea');
        hidden.name = 'prompt-textarea';
        hidden.style.display = 'none';
        const box = document.createElement('div');
        box.className = 'ProseMirror';
        box.contentEditable = 'true';
        box.setAttribute('role', 'textbox');
        const dictate = document.createElement('button');
        dictate.type = 'button';
        dictate.setAttribute('data-dictation-button', 'idle');
        dictate.setAttribute('aria-label', o.persian ? 'دیکته' : 'Dictate');
        dictate.addEventListener('click', () => (window.__gptVoiceClicked = true));
        const btn = document.createElement('button');
        btn.className = 'size-token-button-composer';
        form.append(hidden, box, dictate, btn);
        stage.append(chat, form);
        if (o.draft) box.innerHTML = `<p>${o.draft}</p>`;

        const update = () => {
          // o.persian: labels in Persian, so only the structural selectors can match.
          btn.removeAttribute('data-composer-voice-start');
          if (o.busy) {
            btn.type = 'button';
            btn.setAttribute('aria-label', o.persian ? 'توقف' : 'Stop');
          } else if (box.innerText.trim() === '' || o.noSendButton) {
            btn.type = 'button';
            btn.setAttribute('data-composer-voice-start', 'true');
            btn.setAttribute('aria-label', o.persian ? 'شروع صدا' : 'Start Voice');
          } else {
            btn.type = 'submit';
            btn.setAttribute('aria-label', o.persian ? 'ارسال' : 'Send');
          }
        };
        box.addEventListener('input', update);
        update();
        btn.addEventListener('click', () => {
          if (btn.type === 'button' && !btn.hasAttribute('data-composer-voice-start')) { window.__gptStopClicked = true; return; }
          if (btn.type !== 'submit') { window.__gptVoiceClicked = true; return; }
          const turn = document.createElement('div');
          turn.setAttribute('data-user-message-bubble', 'true');
          turn.textContent = box.innerText.trim();
          chat.appendChild(turn);
          box.innerHTML = '';
          if (o.answers) o.busy = true; // starts answering right after a send
          update();
        });
        const endBusy = () => { o.busy = false; update(); };
        return { box, btn, chat, endBusy };
      }
      const gpt = globalThis.CaptionRelaySelectors.chatgpt;
      const gptTurns = (p) => [...p.chat.querySelectorAll('[data-user-message-bubble="true"]')].map((q) => q.textContent);

      await check('ChatGPT: empty box → sent via the composer submit button', async () => {
        const p = buildGpt();
        const ack = await chatApi.deliver(gpt, 'What is dependency injection?');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(ack.detail.includes('form[data-chatgpt-composer] button[type="submit"]'), ack.detail);
        expect(gptTurns(p)[0] === 'What is dependency injection?', 'turn: ' + gptTurns(p)[0]);
        return ack.detail;
      });

      await check("ChatGPT: user's draft is kept and sent before our text", async () => {
        const p = buildGpt({ draft: 'My own draft' });
        const ack = await chatApi.deliver(gpt, 'caption text');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(/^My own draft caption text$/.test(gptTurns(p)[0]), 'turn: ' + JSON.stringify(gptTurns(p)[0]));
      });

      await check('ChatGPT: answering (Persian UI, Stop button) → busy, stop never clicked, nothing inserted', async () => {
        window.__gptStopClicked = false;
        const p = buildGpt({ busy: true, persian: true });
        const ack = await chatApi.deliver(gpt, 'must wait');
        expect(ack.status === 'busy', JSON.stringify(ack));
        expect(!window.__gptStopClicked, 'stop was clicked');
        expect(p.box.innerText.trim() === '', 'box: ' + p.box.innerText);
      });

      await check('ChatGPT: two sends while answering → merged into ONE message when the answer ends', async () => {
        window.__gptStopClicked = false;
        const p = buildGpt({ busy: true });
        const results = [];
        const onResult = (ids, a) => results.push([ids.join(','), a.status]);
        const a1 = await chatApi.deliverOrQueue(gpt, 'first part', 'g-1', { onResult, settleMs: 50 });
        const a2 = await chatApi.deliverOrQueue(gpt, 'second part', 'g-2', { onResult, settleMs: 50 });
        expect(a1.status === 'queued' && a2.status === 'queued', JSON.stringify([a1, a2]));
        await new Promise((r) => setTimeout(r, 200));
        expect(gptTurns(p).length === 0, 'submitted while answering!');
        p.endBusy();
        expect(await waitFor(() => results.length === 1), 'no result');
        expect(results[0][0] === 'g-1,g-2' && results[0][1] === 'sent', JSON.stringify(results));
        expect(gptTurns(p).length === 1 && /^first part second part$/.test(gptTurns(p)[0]), 'turns: ' + JSON.stringify(gptTurns(p)));
        expect(!window.__gptStopClicked, 'stop clicked');
      });

      await check('ChatGPT: starts answering right after the send → still verified as sent', async () => {
        const p = buildGpt({ answers: true });
        const ack = await chatApi.deliver(gpt, 'quick answer please');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(gptTurns(p).length === 1, 'turns: ' + gptTurns(p).length);
      });

      await check('ChatGPT: send button never appears → voice button never clicked, error reported', async () => {
        window.__gptVoiceClicked = false;
        buildGpt({ noSendButton: true });
        const ack = await chatApi.deliver(gpt, 'no send button', { buttonWaitMs: 300, verifyMs: 300 });
        expect(!window.__gptVoiceClicked, 'the voice button was clicked');
        expect(ack.status === 'error', JSON.stringify(ack));
      });

      await check('ChatGPT: editor appears only after load (hydration) → waited for, then sent', async () => {
        const p = buildGpt();
        p.box.contentEditable = 'false';
        setTimeout(() => (p.box.contentEditable = 'true'), 500);
        const ack = await chatApi.deliver(gpt, 'sent after hydration');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(gptTurns(p)[0] === 'sent after hydration', 'turn: ' + gptTurns(p)[0]);
      });

      await check('ChatGPT Test: inserts without submitting, hidden textarea skipped', async () => {
        const p = buildGpt();
        const r = await chatApi.test(gpt, 'CaptionRelay test');
        expect(r.ok, JSON.stringify(r));
        expect(p.box.innerText.trim() === 'CaptionRelay test', 'box: ' + p.box.innerText);
        expect(gptTurns(p).length === 0, 'submitted!');
        expect(r.report.input === 'form[data-chatgpt-composer] div.ProseMirror[contenteditable="true"]', 'input selector: ' + r.report.input);
        expect(r.report.sendButtonAfterInsert === 'form[data-chatgpt-composer] button[type="submit"]', 'send: ' + r.report.sendButtonAfterInsert);
        expect(r.report.stopButton === null && !r.report.busy, 'busy while idle: ' + r.report.stopButton);
        return r.detail;
      });

      // ---- Phase 14: Claude-like page ----
      // Structure as on claude.ai (2026-11-13): <fieldset> with a Tiptap editor
      // <div data-testid="chat-input" contenteditable role="textbox">, a microphone button, and
      // <button data-testid="chat-input-send"> (always shown, disabled while empty). While answering,
      // <button data-testid="chat-input-stop"> is shown and the send button is hidden.
      function buildClaude(o = {}) {
        const stage = document.getElementById('stage');
        stage.innerHTML = '';
        const chat = document.createElement('div');
        const fs = document.createElement('fieldset');
        const box = document.createElement('div');
        box.className = 'tiptap ProseMirror';
        box.contentEditable = 'true';
        box.setAttribute('role', 'textbox');
        box.setAttribute('data-testid', 'chat-input');
        const mic = document.createElement('button');
        mic.type = 'button';
        mic.setAttribute('aria-label', o.persian ? 'میکروفون' : 'Microphone');
        mic.addEventListener('click', () => (window.__claudeMicClicked = true));
        const send = document.createElement('button');
        send.type = 'button';
        send.setAttribute('data-testid', 'chat-input-send');
        send.setAttribute('aria-label', o.persian ? 'ارسال پیام' : 'Send message');
        const stop = document.createElement('button');
        stop.type = 'button';
        stop.setAttribute('data-testid', 'chat-input-stop');
        stop.setAttribute('aria-label', o.persian ? 'توقف پاسخ' : 'Stop response');
        stop.addEventListener('click', () => (window.__claudeStopClicked = true));
        fs.append(box, mic, send, stop);
        stage.append(chat, fs);
        if (o.draft) box.innerHTML = `<p>${o.draft}</p>`;
        const update = () => {
          send.style.display = o.busy ? 'none' : '';
          stop.style.display = o.busy ? '' : 'none';
          send.disabled = box.innerText.trim() === '';
        };
        box.addEventListener('input', update);
        update();
        send.addEventListener('click', () => {
          if (send.disabled || o.busy) return;
          const turn = document.createElement('div');
          turn.setAttribute('data-testid', 'user-message');
          turn.textContent = box.innerText.trim();
          chat.appendChild(turn);
          box.innerHTML = '';
          update();
        });
        const endBusy = () => { o.busy = false; update(); };
        return { box, chat, endBusy };
      }
      const cl = globalThis.CaptionRelaySelectors.claude;
      const clTurns = (p) => [...p.chat.querySelectorAll('[data-testid="user-message"]')].map((q) => q.textContent);

      await check('Claude: empty box → sent via data-testid="chat-input-send"', async () => {
        const p = buildClaude();
        const ack = await chatApi.deliver(cl, 'What is a span in C#?');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(ack.detail.includes('button[data-testid="chat-input-send"]'), ack.detail);
        expect(clTurns(p)[0] === 'What is a span in C#?', 'turn: ' + clTurns(p)[0]);
        return ack.detail;
      });

      await check("Claude: user's draft is kept and sent before our text", async () => {
        const p = buildClaude({ draft: 'My own draft' });
        const ack = await chatApi.deliver(cl, 'caption text');
        expect(ack.status === 'sent', JSON.stringify(ack));
        expect(/^My own draft caption text$/.test(clTurns(p)[0]), 'turn: ' + JSON.stringify(clTurns(p)[0]));
      });

      await check('Claude: answering (Persian UI, chat-input-stop) → busy, stop never clicked', async () => {
        window.__claudeStopClicked = false;
        const p = buildClaude({ busy: true, persian: true });
        const ack = await chatApi.deliver(cl, 'must wait');
        expect(ack.status === 'busy', JSON.stringify(ack));
        expect(!window.__claudeStopClicked, 'stop was clicked');
        expect(p.box.innerText.trim() === '', 'box: ' + p.box.innerText);
      });

      await check('Claude: two sends while answering → merged into ONE message when the answer ends', async () => {
        window.__claudeStopClicked = false;
        const p = buildClaude({ busy: true });
        const results = [];
        const onResult = (ids, a) => results.push([ids.join(','), a.status]);
        const a1 = await chatApi.deliverOrQueue(cl, 'first part', 'c-1', { onResult, settleMs: 50 });
        const a2 = await chatApi.deliverOrQueue(cl, 'second part', 'c-2', { onResult, settleMs: 50 });
        expect(a1.status === 'queued' && a2.status === 'queued', JSON.stringify([a1, a2]));
        await new Promise((r) => setTimeout(r, 200));
        expect(clTurns(p).length === 0, 'submitted while answering!');
        p.endBusy();
        expect(await waitFor(() => results.length === 1), 'no result');
        expect(results[0][0] === 'c-1,c-2' && results[0][1] === 'sent', JSON.stringify(results));
        expect(clTurns(p).length === 1 && /^first part second part$/.test(clTurns(p)[0]), 'turns: ' + JSON.stringify(clTurns(p)));
        expect(!window.__claudeStopClicked && !window.__claudeMicClicked, 'stop or mic clicked');
      });

      await check('Claude Test: inserts without submitting and reports selectors', async () => {
        const p = buildClaude();
        const r = await chatApi.test(cl, 'CaptionRelay test');
        expect(r.ok, JSON.stringify(r));
        expect(p.box.innerText.trim() === 'CaptionRelay test', 'box: ' + p.box.innerText);
        expect(clTurns(p).length === 0, 'submitted!');
        expect(r.report.input === 'div[data-testid="chat-input"][contenteditable="true"]', 'input selector: ' + r.report.input);
        expect(r.report.sendButtonAfterInsert === 'button[data-testid="chat-input-send"]' && r.report.sendButtonEnabled, 'send: ' + r.report.sendButtonAfterInsert);
        expect(!r.report.busy, 'busy while idle');
        return r.detail;
      });

      const failed = results.filter((r) => r.startsWith('FAIL')).length;
      document.getElementById('results').textContent = results.join('\n');
      document.title = failed ? `FAILED ${failed}/${results.length}` : `PASSED ${results.length}/${results.length}`;
    })();
  </script>
</body>
</html>
